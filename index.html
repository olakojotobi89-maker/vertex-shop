<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create your account — Vertex Shop</title>
<meta name="description" content="Create a Vertex Shop account to order meals, pastries and drinks for delivery or pickup.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>

<main class="auth-page">
  <div class="auth-sheet-wrap">

    <!-- ============ Header ============ -->
    <section class="auth-top">
      <div class="container">
        <a href="index.html" class="auth-logo" aria-label="Vertex Shop home">
          <!-- Real logo -->
          <img src="image/logo.png" alt="Vertex Shop" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <span class="auth-logo-fallback" style="display:none;">VS</span>
          <span class="auth-logo-word">Vertex Shop</span>
        </a>
        <h1>Create your Vertex Shop account</h1>
        <p>Order your favorite meals and pastries from the comfort of your home.</p>
      </div>
    </section>

    <div class="plate-rim" aria-hidden="true" style="margin-top:-20px; position:relative; z-index:1;"></div>

    <!-- ============ Registration form ============ -->
    <section class="auth-sheet" style="margin-top:-1px; border-radius:0 0 28px 28px;">
      <div class="container">

        <form id="register-form" novalidate>

          <div class="form-field">
            <label for="full-name">Full name</label>
            <input
              type="text"
              id="full-name"
              name="fullName"
              autocomplete="name"
              placeholder="e.g. Amara Okafor"
              required
              minlength="2">
          </div>

          <div class="form-field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="you@example.com"
              required>
          </div>

          <div class="form-field">
            <label for="phone">Phone number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              autocomplete="tel"
              placeholder="080 000 0000"
              pattern="^[0-9+\s\-]{7,15}$"
              required>
            <p class="form-field-hint">We'll use this to reach you about your order.</p>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              placeholder="At least 8 characters"
              minlength="8"
              required>
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirm password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              autocomplete="new-password"
              placeholder="Re-enter your password"
              minlength="8"
              required>
            <p class="form-field-hint" id="password-match-hint"></p>
          </div>

          <div class="form-check">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the Terms of Service and Privacy Policy.</label>
          </div>

          <div id="register-error" class="form-field-hint" role="alert" style="color:#B3402A; display:none; margin-bottom:12px;"></div>

          <button type="submit" class="btn btn-primary btn-block">Create Account</button>

        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Log in</a>
        </p>

      </div>
    </section>

  </div>
</main>

<script src="js/auth.js"></script>
</body>
</html>
